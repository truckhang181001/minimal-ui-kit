# Serves the CRA production build behind the edge nginx (plain HTTP; TLS
# terminates at Cloudflare + the edge).
#
# The security headers are repeated inside each location on purpose: a
# location that sets any add_header of its own drops every server-level one.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed CRA bundles (static/js, static/css, static/media): cache forever.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback for client-side routes (deep links + refresh).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
